[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-crm"
version = "0.1.0"
description = "Private event lead prioritization, recorded attendance, and team delegation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
event-crm = "event_crm.cli:main"

[tool.setuptools.package-data]
event_crm = ["static/*"]

[tool.setuptools.packages.find]
include = ["event_crm*"]
