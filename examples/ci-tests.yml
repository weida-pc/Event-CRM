# Optional: copy to .github/workflows/tests.yml with repository-owner authorization.
name: Synthetic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ".[photos]"
      - run: python -m unittest discover -s tests -v
      - run: node --test browser/partiful.test.mjs
      - run: node --test tests/photo_ui.test.mjs
      - run: node --check event_crm/static/app.js
      - run: python -m compileall -q event_crm tools
      - run: python tools/privacy_check.py
